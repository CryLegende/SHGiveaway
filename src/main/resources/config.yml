# ----------------------------------------------------------------#
#                   Configuration de SHGiveaway                   #
# ----------------------------------------------------------------#
#
# Giveaways planifiés : les joueurs qui remplissent les conditions sont inscrits automatiquement à leur connexion,
# et le tirage a lieu à la date indiquée. Un gagnant hors-ligne reçoit sa récompense à sa prochaine connexion.
#
# Commande (racine /shgiveaway, aucun alias) :
#   /shgiveaway reload                                   Recharge config.yml et messages.yml (sauf le bloc reseau, qui
#                                                        demande un redémarrage). Un fichier invalide annule le
#                                                        rechargement. data.yml n'est pas relu.
#   /shgiveaway draw <id>                                Tire au sort le giveaway tout de suite.
#   /shgiveaway status <id>                              Affiche l'état d'un giveaway.
#   /shgiveaway active                                   Liste les giveaways actifs.
#   /shgiveaway history (page)                           Affiche les derniers tirages.
#   /shgiveaway participants <id> (page)                 Liste les participants.
#   /shgiveaway add <id> <joueur|uuid>                   Inscrit un joueur.
#   /shgiveaway remove <id> <joueur|uuid>                Désinscrit un joueur.
#   /shgiveaway blacklist add|remove <id> <joueur|uuid>  Exclut un joueur du giveaway, ou le réintègre.
#   /shgiveaway blacklist list <id> (page)               Liste les joueurs exclus.
#   /shgiveaway import                                   Reprend data.yml dans la base partagée (mode réseau).
#   /shgiveaway pending (page)                           Liste les récompenses de gagnants pas encore données.
#
# Permissions :
#   shgiveaway.admin                   Toutes les sous-commandes (op par défaut).
#   shgiveaway.admin.<sous-commande>   Une seule sous-commande : reload, draw, status, active, history, participants,
#                                      add, remove, blacklist, import ou pending (ex. shgiveaway.admin.draw).
#
# Les textes sont dans messages.yml. Les gagnants sont écrits dans le fichier gagnants de SHLogs.

# Plusieurs serveurs de jeu : actif seulement si SHNetwork est installé ; sans lui, rien ne change (tout est dans data.yml).
# Avec SHNetwork, participants, gagnants, joueurs exclus et récompenses en attente sont dans la base ci-dessous, et :
#   - un seul tirage pour tout le réseau : le serveur meneur lance les tirages planifiés, la base désigne le seul serveur
#     qui tire, tous les serveurs annoncent le résultat ;
#   - un joueur s'inscrit en se connectant sur n'importe quel serveur ;
#   - un gagnant reçoit sa récompense tout de suite s'il est connecté sur un serveur, sinon à sa prochaine connexion,
#     une seule fois ;
#   - data.yml ne garde que l'historique de /shgiveaway history. /shgiveaway import reprend le reste dans la base.
# Tous les serveurs doivent avoir les mêmes giveaways dans config.yml. Demande un redémarrage : tout le bloc.
reseau:
  actif: true
  # Canal du bus SHNetwork où les tirages sont annoncés aux autres serveurs
  canal: giveaway
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shgiveaway
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion à la base, en millisecondes
    delai-ms: 5000
  # Table des comptes connus du réseau (colonnes name en minuscules et display_name) : retrouve un joueur par son
  # pseudo avec /shgiveaway add, remove et blacklist même s'il ne s'est jamais connecté sur ce serveur.
  # Vide : seuls les joueurs connectés sur le réseau ou déjà venus sur ce serveur sont retrouvés.
  table-comptes: "Global.sh_track_firstseen"

settings:
  # Fuseau horaire des dates de tirage (draw-at).
  timezone: "Europe/Paris"
  # Format de %draw_date% dans les messages.
  date-format: "dd/MM/yyyy"
  # Format de %draw_time% dans les messages.
  time-format: "HH:mm"
  # Nombre de tirages gardés dans l'historique de /shgiveaway history (10 au minimum).
  history-limit: 100

# Sons joués avec les messages du même nom (winner-direct accompagne winner-personal-online).
# Chaque son a : enabled, sound (nom Bukkit ou clé minecraft:...), volume, pitch.
sounds:
  join-added:
    enabled: true
    sound: "BLOCK_AMETHYST_BLOCK_CHIME"
    volume: 1.0
    pitch: 1.2

  join-already:
    enabled: true
    sound: "UI_BUTTON_CLICK"
    volume: 1.0
    pitch: 1.0

  winner-announcement:
    enabled: true
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 1.0
    pitch: 1.0

  winner-direct:
    enabled: true
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0

  no-participants:
    enabled: false
    sound: "BLOCK_NOTE_BLOCK_BASS"
    volume: 1.0
    pitch: 0.8

# Giveaways, chacun sous son identifiant (celui des commandes /shgiveaway).
giveaways:
  vipelite:
    # Activer ce giveaway.
    enabled: true
    # Récompense affichée dans les messages (%prize%).
    prize-display: "grade VipElite"
    # Nombre de gagnants tirés.
    winners: 1
    # Date et heure du tirage (aaaa-MM-jj HH:mm, fuseau settings.timezone).
    draw-at: "2026-04-26 20:00"
    # Identifiant du tour (facultatif, par défaut la valeur de draw-at). Quand il change, un nouveau tour commence :
    # participants et état « tiré » sont remis à zéro. Changer draw-at change donc le tour, sauf si round-key est fixé.
    # round-key: "tour-1"

    # Secondes entre la connexion du joueur et son message de participation.
    join-message-delay-seconds: 4
    # Envoyer le message de participation à la connexion.
    announce-on-join: true

    # Temps de jeu minimum, en minutes, pour participer.
    min-playtime-minutes: 180
    # Ancienneté minimale du compte, en heures, pour participer.
    min-account-age-hours: 48

    # Permissions requises pour participer (vide : tout le monde).
    required-permissions:

    # Groupes Vault exclus du giveaway.
    excluded-groups:
      - "VipElite"
    # Permissions qui excluent du giveaway.
    excluded-permissions:
      - "group.vipelite"

    # Commandes console lancées pour chaque gagnant (%player%, %uuid%). Pour un gagnant hors-ligne, elles attendent
    # sa prochaine connexion.
    reward-commands:
      - "lp user %player% parent add vipelite"
