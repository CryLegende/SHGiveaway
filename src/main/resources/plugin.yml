name: SHGiveaway
version: '${project.version}'
main: org.Cry_Legende.sHGiveaway.SHGiveaway
api-version: '1.20'
author: Cry_Legende
depend: [Vault]

commands:
  shgiveaway:
    description: Gestion des giveaways SHGiveaway
    usage: /shgiveaway <reload|draw|status|active|history|participants|add|remove|blacklist>
    permission: shgiveaway.admin

permissions:
  shgiveaway.admin:
    description: Administration du plugin SHGiveaway
    default: op
