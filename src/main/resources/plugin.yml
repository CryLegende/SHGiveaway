name: SHGiveaway
version: '${project.version}'
main: org.Cry_Legende.sHGiveaway.SHGiveaway
api-version: '1.20'
author: Cry_Legende
depend: [Vault]
# SHNetwork est facultatif : sans lui, le plugin tourne seul comme avant.
softdepend: [SHLogs, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (base partagée en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shgiveaway:
    description: Gestion des giveaways SHGiveaway
    usage: /shgiveaway <reload|draw|status|active|history|participants|add|remove|blacklist|import|pending>

permissions:
  shgiveaway.admin:
    description: Toutes les commandes d'administration de SHGiveaway
    default: op
    children:
      shgiveaway.admin.reload: true
      shgiveaway.admin.draw: true
      shgiveaway.admin.status: true
      shgiveaway.admin.active: true
      shgiveaway.admin.history: true
      shgiveaway.admin.participants: true
      shgiveaway.admin.add: true
      shgiveaway.admin.remove: true
      shgiveaway.admin.blacklist: true
      shgiveaway.admin.import: true
      shgiveaway.admin.pending: true
  shgiveaway.admin.reload:
    description: Recharger config.yml et messages.yml
    default: false
  shgiveaway.admin.draw:
    description: Tirer un giveaway tout de suite
    default: false
  shgiveaway.admin.status:
    description: Voir l'état d'un giveaway
    default: false
  shgiveaway.admin.active:
    description: Lister les giveaways actifs
    default: false
  shgiveaway.admin.history:
    description: Voir les derniers tirages
    default: false
  shgiveaway.admin.participants:
    description: Lister les participants d'un giveaway
    default: false
  shgiveaway.admin.add:
    description: Inscrire un joueur à un giveaway
    default: false
  shgiveaway.admin.remove:
    description: Désinscrire un joueur d'un giveaway
    default: false
  shgiveaway.admin.blacklist:
    description: Gérer les joueurs exclus d'un giveaway
    default: false
  shgiveaway.admin.import:
    description: Reprendre data.yml dans la base partagée (mode réseau)
    default: false
  shgiveaway.admin.pending:
    description: Voir les récompenses de gagnants pas encore données
    default: false
